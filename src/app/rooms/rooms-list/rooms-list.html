<h1>{{title}}</h1>
<table class="table">
  <thead>
    <tr>
      <th>Room Number</th>
      <th>Room Type</th>
      <th>Room Price</th>
      <th>Room Amenities</th>
      <th>Checkin Time</th>
      <th>Select Room</th>
    </tr>
  </thead>
  <tbody>
    @for (room of rooms; track room.roomNumber; let e = $even, o = $odd) {
      <tr [class]="e ? 'even' : 'odd'">
        <td>{{ room.roomNumber }}</td>
        <td>{{ room.roomType }}</td>
        <td>{{ room.price }}</td>
        <td>{{ room.amenities }}</td>
        <td>{{ room.checkinTime }}</td>
        <td><button class="btn btn-primary" (click)="selectRoom(room)">Select</button></td>
      </tr>
    }
  </tbody>
</table>
